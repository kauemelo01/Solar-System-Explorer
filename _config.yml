# GitHub Pages / Jekyll settings: site identity and per-page titles and descriptions for search engines.
# index.html (the app) has no front matter, so Jekyll copies it unchanged.
title: Solar System Explorer
description: >-
  Interactive 3D orrery where any planet, moon or comet can be the centre, with NASA/JPL data, spacecraft surface maps, the real night sky and the 88 constellations.
url: https://kauemelo01.github.io
baseurl: /Solar-System-Explorer
lang: en_US
image: /social-card.png
twitter:
  card: summary_large_image
author: kauemelo01
defaults:
  - scope:
      path: "docs/README.md"
    values:
      title: "Solar System Explorer: documentation"
      description: "Documentation for Solar System Explorer: every object in the 3D orrery with the NASA/JPL record each value comes from, plus sources and accuracy."
  - scope:
      path: "docs/sources.md"
    values:
      title: "Sources, methodology and accuracy"
      description: "Where every number in Solar System Explorer comes from, and how accurate it is: JPL orbits and the ephemerides they are fitted to, the accuracy targets every orbit is checked against, NASA fact sheets, star catalogues, sky maps and IAU constellation boundaries."
  - scope:
      path: "docs/interface.md"
    values:
      title: "The interface"
      description: "How to use Solar System Explorer: the layout, every control and keyboard shortcut, the menu, the time bar, the object and camera position cards, trails, and the settings it remembers."
  - scope:
      path: "docs/catalogue/sun-planets.md"
    values:
      title: "Sun, planets and the Moon"
      description: "The Sun, the eight planets and the Moon in Solar System Explorer: JPL planetary elements, the Moon from Meeus's lunar theory, NAIF IDs and links to JPL Horizons and NASA fact sheets."
  - scope:
      path: "docs/catalogue/small-bodies.md"
    values:
      title: "Dwarf planets, asteroids, centaurs and comets"
      description: "Dwarf planets (Pluto among them), dwarf planet candidates, asteroids, centaurs and comets in Solar System Explorer, with orbits fitted to JPL Horizons over 1800–2050 AD, SBDB orbital elements, sizes with their sources, and links to the JPL Small-Body Database."
  - scope:
      path: "docs/catalogue/moons-mars.md"
    values:
      title: "Moons of Mars"
      description: "Phobos and Deimos in Solar System Explorer: positions fitted to JPL Horizons over 1800–2050 AD, JPL mean orbital elements, sizes and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-jupiter.md"
    values:
      title: "Moons of Jupiter"
      description: "All 115 moons of Jupiter in Solar System Explorer, by family, with positions fitted to JPL Horizons over 1800–2050 AD, JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-saturn.md"
    values:
      title: "Moons of Saturn"
      description: "All 292 moons of Saturn in Solar System Explorer, by family, with positions fitted to JPL Horizons over 1800–2050 AD, JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-uranus.md"
    values:
      title: "Moons of Uranus"
      description: "All 29 moons of Uranus in Solar System Explorer, with positions fitted to JPL Horizons over 1800–2050 AD (S/2025 U 1, not yet in Horizons, uses JPL's mean elements), JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-neptune.md"
    values:
      title: "Moons of Neptune"
      description: "All 16 moons of Neptune in Solar System Explorer, with positions fitted to JPL Horizons over 1800–2050 AD, JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-pluto.md"
    values:
      title: "Moons of Pluto"
      description: "Charon, Styx, Nix, Kerberos and Hydra in Solar System Explorer, with positions fitted to JPL Horizons over 1800–2050 AD, JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-small-bodies.md"
    values:
      title: "Moons of dwarf planets and asteroids"
      description: "Dysnomia, Hiʻiaka, Namaka, Weywot, Vanth, Xiangliu, Dimorphos, Skamandrios, Queta and Menoetius in Solar System Explorer, with orbits fitted to JPL Horizons or to Proudfoot et al. (2024), or taken from published papers."
  - scope:
      path: "docs/catalogue/rings.md"
    values:
      title: "Ring systems"
      description: "The rings of Jupiter, Saturn, Uranus, Neptune, Haumea, Quaoar and Chariklo in Solar System Explorer, with radii, widths and sources."
  - scope:
      path: "docs/catalogue/sky.md"
    values:
      title: "The sky beyond the solar system"
      description: "Stars, the Milky Way, nebulae, clusters, galaxies and planet-hosting stars in Solar System Explorer, with positions, distances and sources."
  - scope:
      path: "docs/catalogue/constellations.md"
    values:
      title: "The 88 constellations"
      description: "The 88 IAU constellations with official boundaries, areas and the 13 zodiac constellations the Sun passes through, Ophiuchus included."
  - scope:
      path: "tools/moon-orbit-fits/README.md"
    values:
      title: "Moon orbit fits"
      description: "How Solar System Explorer fits the orbit of every planetary moon to JPL Horizons over 1800–2050 AD: the scripts, the steps and the checks."
  - scope:
      path: "tools/small-body-orbit-fits/README.md"
    values:
      title: "Small-body orbit fits"
      description: "How Solar System Explorer fits the orbits of 56 dwarf planets, asteroids and comets, and six of their moons, to JPL Horizons and other reference ephemerides: the scripts, the steps and the checks."
  # Copies of two JPL pages, kept for the moon-orbit tools. They have no front matter, so Jekyll copies them unchanged and they keep
  # JPL's own titles; these entries record what they are, and take effect only if front matter is ever added.
  - scope:
      path: "tools/moon-orbit-fits/jpl-sat-elements.html"
    values:
      title: "JPL Planetary Satellite Mean Elements (copy)"
      description: "A copy of JPL's Planetary Satellite Mean Elements table, used by Solar System Explorer's moon-orbit tools; the original is at ssd.jpl.nasa.gov/sats/elem/."
  - scope:
      path: "tools/moon-orbit-fits/jpl-sat-physical-parameters.html"
    values:
      title: "JPL Planetary Satellite Physical Parameters (copy)"
      description: "A copy of JPL's Planetary Satellite Physical Parameters table, kept for reference by Solar System Explorer's moon-orbit tools; the original is at ssd.jpl.nasa.gov/sats/phys_par/."
