# GitHub Pages / Jekyll settings: site identity and per-page titles and descriptions for search engines.
# index.html (the app) has no front matter, so Jekyll copies it unchanged.
title: Solar System Explorer
description: >-
  Interactive 3D orrery where any planet, moon or comet can be the centre, with NASA/JPL data, spacecraft surface maps, the real night sky and the 88 constellations.
url: https://kauemelo01.github.io
baseurl: /Solar-System-Explorer
lang: en_US
image: /social-card.png
twitter:
  card: summary_large_image
author: kauemelo01
defaults:
  - scope:
      path: "docs/README.md"
    values:
      title: "Documentation and object catalogue"
      description: "Documentation for Solar System Explorer: every object in the 3D orrery with the NASA/JPL record each value comes from, plus sources and accuracy."
  - scope:
      path: "docs/sources.md"
    values:
      title: "Sources, methodology and accuracy"
      description: "Where every number in Solar System Explorer comes from: JPL orbital elements, NASA fact sheets, star catalogues, sky maps and IAU constellation boundaries."
  - scope:
      path: "docs/catalogue/sun-planets.md"
    values:
      title: "Sun, planets and the Moon"
      description: "The Sun, the eight planets and the Moon in Solar System Explorer, with NAIF IDs and links to JPL Horizons and NASA fact sheets."
  - scope:
      path: "docs/catalogue/small-bodies.md"
    values:
      title: "Dwarf planets, candidates, asteroids, centaurs and comets"
      description: "Dwarf planets (Pluto among them), dwarf planet candidates, asteroids, centaurs and comets in Solar System Explorer, with orbital elements and links to the JPL Small-Body Database."
  - scope:
      path: "docs/catalogue/moons-mars.md"
    values:
      title: "Moons of Mars"
      description: "Phobos and Deimos: orbital elements, sizes and links to JPL Horizons and NASA, as used in Solar System Explorer."
  - scope:
      path: "docs/catalogue/moons-jupiter.md"
    values:
      title: "Moons of Jupiter"
      description: "All 115 moons of Jupiter in Solar System Explorer, by family, with JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-saturn.md"
    values:
      title: "Moons of Saturn"
      description: "All 292 moons of Saturn in Solar System Explorer, by family, with JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-uranus.md"
    values:
      title: "Moons of Uranus"
      description: "All 29 moons of Uranus in Solar System Explorer, with JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-neptune.md"
    values:
      title: "Moons of Neptune"
      description: "All 16 moons of Neptune in Solar System Explorer, with JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-pluto.md"
    values:
      title: "Moons of Pluto"
      description: "Charon, Styx, Nix, Kerberos and Hydra in Solar System Explorer, with JPL mean orbital elements and links to JPL Horizons and NASA."
  - scope:
      path: "docs/catalogue/moons-small-bodies.md"
    values:
      title: "Moons of dwarf planets and asteroids"
      description: "Dysnomia, Hiʻiaka, Namaka, Weywot, Vanth, Xiangliu, Dimorphos and Selam in Solar System Explorer, with orbits from JPL Horizons and published papers."
  - scope:
      path: "docs/catalogue/rings.md"
    values:
      title: "Ring systems"
      description: "The rings of Jupiter, Saturn, Uranus, Neptune, Haumea, Quaoar and Chariklo in Solar System Explorer, with radii, widths and sources."
  - scope:
      path: "docs/catalogue/sky.md"
    values:
      title: "The sky beyond the solar system"
